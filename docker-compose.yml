# services:
#   develop   — build + debug environment with GUI and /dev passthrough
#   runtime   — headless deployment with auto-starting arm_node + calib_node
#
# Usage:
#   docker compose up develop    # interactive dev shell
#   docker compose up runtime -d # deploy to robot

services:
  develop:
    image: realman:develop
    build:
      context: .
      target: realman-develop
      network: host
      args:
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
    user: "1000:1000"
    privileged: true
    network_mode: host
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix
      - .:/ws
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RCUTILS_COLORIZED_OUTPUT=1
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
    ports:
      - "8080:8080"   # RM arm API
      - "2022:2022"   # SSH deploy to runtime
    stdin_open: true
    tty: true

  runtime:
    image: realman:runtime
    build:
      context: .
      target: realman-runtime
      network: host
      args:
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
    privileged: true
    network_mode: host
    volumes:
      - /dev:/dev
    restart: unless-stopped

