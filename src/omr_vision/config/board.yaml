# Calibration board parameters
# type: "chessboard" or "charuco" (default: chessboard)
type: chessboard
# XX: number of inner corners along the long edge (long_side_grids - 1)
# YY: number of inner corners along the short edge (short_side_grids - 1)
# L:  square side length in meters
XX: 11
YY: 8
L: 0.03
# Charuco only: marker side length (meters)
marker_size_m: 0.02
# Charuco only: ArUco dictionary (DICT_4X4_50, DICT_6X6_250, etc.)
dictionary: DICT_6X6_250
