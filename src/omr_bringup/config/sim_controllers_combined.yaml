# gz_ros2_control plugin params (node name is gz_ros_control, not gz_ros2_control)
gz_ros_control:
  ros__parameters:
    position_proportional_gain: 1.0

controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    dais_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    dais_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

dais_joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_dais
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    open_loop_control: false
    pid: {p: 1.0, i: 0.1, d: 0.01, i_clamp: 1.0}
    command_joints:
      - joint_dais
    allow_integration_in_goal_trajectories: true
