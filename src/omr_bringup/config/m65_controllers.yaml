controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    joints:
      - left_wheel_joint
      - right_wheel_joint

    left_wheel_names:
      - left_wheel_joint
    right_wheel_names:
      - right_wheel_joint

    wheel_separation: 0.355  # TODO: measure actual M65 chassis dimensions
    wheel_radius: 0.0625  # TODO: measure actual M65 chassis dimensions

    odom_frame_id: odom
    base_frame_id: base_footprint

    pose_covariance_diagonal: [0.001, 0.001, 1.0e6, 1.0e6, 1.0e6, 0.001]
    twist_covariance_diagonal: [0.001, 1.0e6, 1.0e6, 1.0e6, 1.0e6, 0.001]

    open_loop: false
    enable_odom_tf: true
    cmd_vel_timeout: 0.5
    publish_limited_velocity: true
    velocity_rolling_window_size: 10
