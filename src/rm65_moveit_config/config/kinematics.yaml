# kinematics.yaml — RM65 kinematic solver configuration
# Joint limits match those defined in rm65_moveit.urdf.xacro

arm_group:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.005
  kinematics_solver_attempts: 3
  solve_type: Speed
  # Joint limits in radians (from URDF <limit> tags)
  joint_limits:
    joint1:
      has_velocity_limits: true
      max_velocity: 3.14
      has_acceleration_limits: false
      max_acceleration: 0.0
      has_position_limits: true
      min_position: -3.1
      max_position: 3.1
    joint2:
      has_velocity_limits: true
      max_velocity: 3.14
      has_acceleration_limits: false
      max_acceleration: 0.0
      has_position_limits: true
      min_position: -2.268
      max_position: 2.268
    joint3:
      has_velocity_limits: true
      max_velocity: 3.92
      has_acceleration_limits: false
      max_acceleration: 0.0
      has_position_limits: true
      min_position: -2.355
      max_position: 2.355
    joint4:
      has_velocity_limits: true
      max_velocity: 3.92
      has_acceleration_limits: false
      max_acceleration: 0.0
      has_position_limits: true
      min_position: -3.1
      max_position: 3.1
    joint5:
      has_velocity_limits: true
      max_velocity: 3.92
      has_acceleration_limits: false
      max_acceleration: 0.0
      has_position_limits: true
      min_position: -2.233
      max_position: 2.233
    joint6:
      has_velocity_limits: true
      max_velocity: 3.92
      has_acceleration_limits: false
      max_acceleration: 0.0
      has_position_limits: true
      min_position: -6.28
      max_position: 6.28
