# controllers.yaml — MoveIt2 controller configuration for RM65
# Uses moveit_simple_controller_manager to connect to the existing
# joint_trajectory_controller at /arm_cm/joint_trajectory_controller/follow_joint_trajectory

controller_manager:
  type: moveit_simple_controller_manager/MoveItSimpleControllerManager

controller_names:
  - arm_cm

arm_cm:
  type: FollowJointTrajectory
  action_ns: joint_trajectory_controller/follow_joint_trajectory
  default: true
  joints:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
  action_monitor_rate: 20.0
