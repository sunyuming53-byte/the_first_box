name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build develop image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: realman-develop
          load: true
          tags: realman:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and test
        run: |
          docker run --rm \
            --user root \
            -v ${{ github.workspace }}:/ws \
            realman:develop \
            bash -c "
              set -euo pipefail
              set +u; source /opt/ros/humble/setup.bash; set -u
              colcon build --symlink-install
              colcon build --cmake-args -DBUILD_TESTING=ON
              colcon test --return-code-on-test-failure
            "

  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build develop image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: realman-develop
          load: true
          tags: realman:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: clang-format (blocking, diff-only)
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...HEAD \
            -- '**.cpp' '**.hpp' '**.h' | grep -v third_party/ || true)
          if [ -z "$CHANGED" ]; then
            echo "No C++ files changed, skipping"
            exit 0
          fi
          echo "$CHANGED" | sed 's|^|/ws/|' | \
            docker run --rm -i -v $(pwd):/ws realman:develop bash -c '
              xargs -r clang-format --dry-run --Werror
            '

      - name: clang-tidy (blocking, diff-only)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/ws \
            realman:develop \
            bash -c '
              set -euo pipefail
              set +u; source /opt/ros/humble/setup.bash; set -u
              colcon build --symlink-install --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | tail -3
              GIT_BASE_REF="${{ github.event.pull_request.base.sha }}" python3 /ws/.github/scripts/run-clang-tidy-diff.py
            '
