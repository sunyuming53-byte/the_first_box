name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build develop image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: omrobot-develop
          load: true
          tags: omrobot:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build
        run: |
          docker run --rm \
            --user root \
            -v ${{ github.workspace }}:/ws \
            omrobot:develop \
            bash -c "
              set -euo pipefail
              set +u; source /opt/ros/humble/setup.bash; set -u
              colcon build --symlink-install \
                --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTING=ON
            "

      - name: Test
        run: |
          docker run --rm \
            --user root \
            -v ${{ github.workspace }}:/ws \
            omrobot:develop \
            bash -c "
              set -euo pipefail
              set +u; source /opt/ros/humble/setup.bash; set -u
              colcon test --return-code-on-test-failure
            "

      - name: clang-format (blocking, diff-only)
        run: |
          CHANGED=$(git diff --name-only --diff-filter=ACMRT ${{ github.event.pull_request.base.sha || 'HEAD~1' }}...HEAD \
            -- '**.cpp' '**.hpp' '**.h' | grep -v third_party/ || true)
          if [ -z "$CHANGED" ]; then
            echo "No C++ files changed, skipping"
            exit 0
          fi
          echo "$CHANGED" | sed 's|^|/ws/|' | \
            docker run --rm -i -v $(pwd):/ws omrobot:develop bash -c '
              xargs -r clang-format --dry-run --Werror
            '

      - name: clang-tidy (blocking, diff-only)
        run: |
          docker run --rm --user root \
            -v ${{ github.workspace }}:/ws \
            omrobot:develop \
            bash -c '
              set -euo pipefail
              git config --global --add safe.directory /ws 2>/dev/null || true
              set +u; source /opt/ros/humble/setup.bash; set -u
              colcon build --symlink-install --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | tail -3
              generate-compile-commands.sh 2>&1 | tail -1
              GIT_BASE_REF="${{ github.event.pull_request.base.sha || 'HEAD~1' }}" \
                python3 /ws/.github/scripts/run-clang-tidy-diff.py
            '
