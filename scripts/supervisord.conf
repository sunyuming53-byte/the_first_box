[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:arm_node]
command=bash -c "source /opt/ros/humble/setup.bash && source /ws/install/setup.bash && ros2 run realman_driver arm_node"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:calib_node]
command=bash -c "source /opt/ros/humble/setup.bash && source /ws/install/setup.bash && ros2 run realman_calibration calib_node"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
