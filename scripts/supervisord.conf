[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:omrobot]
command=bash -c "source /opt/ros/humble/setup.bash && [ -f /ws_livox/install/setup.bash ] && source /ws_livox/install/setup.bash; source /ws/install/setup.bash && ros2 launch omr_bringup bringup.launch.py arm_ip:=${ARM_IP:-192.168.1.18} launch_calib:=false"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
