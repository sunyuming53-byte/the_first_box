[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:omrobot]
command=bash -c "source /opt/ros/humble/setup.bash && source /ws/install/setup.bash && ros2 launch omr_bringup bringup.launch.py arm_ip:=${ARM_IP:-192.168.1.18} launch_calib:=false"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
